version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuroscan-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=NeuroScan AI
      - MAX_UPLOAD_SIZE_MB=350
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173"]
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuroscan-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped
